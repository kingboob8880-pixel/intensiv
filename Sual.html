<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>50 вопросов по Акыде - Полная проверка</title>
    <style>
        :root {
            --primary: #1b4332;
            --secondary: #2d6a4f;
            --accent: #d4af37;
            --bg: #f8f9fa;
            --card-bg: #ffffff;
            --text: #212529;
            --text-light: #6c757d;
        }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: var(--bg); color: var(--text); margin: 0; padding: 20px; line-height: 1.6; }
        .container { max-width: 1000px; margin: 0 auto; }
        header { text-align: center; margin-bottom: 40px; padding: 20px; border-bottom: 2px solid var(--accent); }
        header h1 { color: var(--primary); margin: 0; font-size: 2em; }
        header p { color: var(--text-light); font-style: italic; margin-top: 10px; }
        .question-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 20px; }
        .question-card { background: var(--card-bg); border-radius: 12px; padding: 25px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); border-left: 5px solid var(--secondary); cursor: pointer; transition: all 0.3s ease; }
        .question-card:hover { transform: translateY(-5px); box-shadow: 0 10px 15px rgba(0,0,0,0.1); border-left-color: var(--accent); }
        .question-card h3 { color: var(--primary); margin-top: 0; font-size: 1.1em; }
        .question-card p { color: var(--text-light); font-size: 0.9em; margin-bottom: 0; }
        .badge { display: inline-block; background: var(--secondary); color: white; padding: 3px 10px; border-radius: 20px; font-size: 0.75em; margin-bottom: 10px; }
        .modal { display: none; position: fixed; z-index: 1000; left: 0; top: 0; width: 100%; height: 100%; background-color: rgba(0, 0, 0, 0.6); backdrop-filter: blur(5px); justify-content: center; align-items: center; padding: 20px; }
        .modal-content { background-color: var(--card-bg); padding: 30px; border-radius: 15px; max-width: 600px; width: 100%; max-height: 80vh; overflow-y: auto; position: relative; border-top: 5px solid var(--accent); box-shadow: 0 10px 25px rgba(0,0,0,0.2); }
        .close-btn { position: absolute; top: 15px; right: 20px; font-size: 28px; font-weight: bold; color: var(--text-light); cursor: pointer; transition: color 0.2s; }
        .close-btn:hover { color: var(--primary); }
        .modal-content h2 { color: var(--primary); margin-top: 0; border-bottom: 1px solid #eee; padding-bottom: 10px; font-size: 1.3em; }
        .answer-section { margin-top: 20px; }
        .answer-section h4 { color: var(--secondary); margin-bottom: 10px; }
        .correct-answer { background-color: #d4edda; border-left: 4px solid #28a745; padding: 15px; border-radius: 5px; margin-bottom: 20px; }
        .deviation-answer { background-color: #f8d7da; border-left: 4px solid #dc3545; padding: 15px; border-radius: 5px; }
        footer { text-align: center; margin-top: 40px; color: var(--text-light); font-size: 0.9em; }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>50 Фундаментальных вопросов Акыды</h1>
        <p>«Тот, чья акыда чиста, тот спасен. Проверяй основы, прежде чем строить стены».</p>
    </header>
    <div class="question-grid" id="questionsGrid"></div>
    <footer>
        <p>Да наставит Аллах на прямой путь и дарует праведного супруга. Амин.</p>
    </footer>
</div>

<div id="mainModal" class="modal">
    <div class="modal-content">
        <span class="close-btn" onclick="closeModal()">&times;</span>
        <h2 id="modalTitle"></h2>
        <div class="answer-section">
            <h4>✅ Правильный ответ (Ахлю Сунна):</h4>
            <div class="correct-answer" id="modalCorrect"></div>
            <h4>❌ Ошибки других течений:</h4>
            <div class="deviation-answer" id="modalDeviation"></div>
        </div>
    </div>
</div>

<script>
const questionsData = [
    { id: 1, badge: "Таухид ар-Рубубийя", title: "1. Суть Таухида ар-Рубубийя", desc: "Что включает в себя вера в Господство Аллаха?", correct: "Мы верим, что Аллах — Единственный Творец, Властелин и Управитель. Никакое действие не совершается без Его воли и создания.", deviation: "Мушрики верили в Рубубийю, но это не сделало их мусульманами. Муътазилиты же отрицают, что Аллах является творцом человеческих поступков." },
    { id: 2, badge: "Таухид ар-Рубубийя", title: "2. Вера в Предопределение (Кадр)", desc: "Является ли вера в Кадр частью Рубубийи?", correct: "Да, вера в то, что всё хорошее и плохое предопределено Аллахом до создания творений — это основа Таухида ар-Рубубийя.", deviation: "Кадариты (муътазилиты) утверждают, что человек сам творит свои поступки, лишая Аллаха атрибута Создателя всего сущего." },
    { id: 3, badge: "Таухид аль-Улюхийя", title: "3. Суть Таухида аль-Улюхийя", desc: "В чем заключается единобожие в поклонении?", correct: "Это направление всех видов поклонения (мольба, жертвоприношение, страх, надежда) только Аллаху, без придания Ему сотоварищей.", deviation: "Суфии и кубуриты направляют часть поклонения (дуа, мольбу о помощи) мертвым праведникам, что является явным ширком." },
    { id: 4, badge: "Таухид аль-Улюхийя", title: "4. Разница между Рубубийей и Улюхийей", desc: "Почему веры только в Рубубийю недостаточно?", correct: "Рубубийя — это признание Аллаха Творцом. Улюхийя — это выделение Его только для поклонения. Мушрики верили в первое, но отвергли второе.", deviation: "Некоторые думают, что если человек признает Аллаха Творцом, он уже мусульманин, игнорируя необходимость ихласа в поклонении." },
    { id: 5, badge: "Ихлас (Искренность)", title: "5. Условия принятия деяний", desc: "Каковы два главных условия принятия deeds?", correct: "1) Ихлас (искренность только перед Аллахом). 2) Мувафака (соответствие Сунне Пророка, мир ему и благословение).", deviation: "Суфии часто ставят любовь к шейху или духовную связь (рабиту) выше или наравне с искренностью перед Аллахом." },
    { id: 6, badge: "Ширк", title: "6. Большой ширк", desc: "Что выводит человека из Ислама?", correct: "Большой ширк — это направление поклонения не Аллаху. Он аннулирует все деяния и делает человека вечным обитателем Ада.", deviation: "Муриджиты и крайние суфии смягчают это, говоря, что ширк в действиях не выводит из религии, если в сердце есть вера." },
    { id: 7, badge: "Ширк", title: "7. Малый ширк (Рия)", desc: "Что такое малый ширк и чем он опасен?", correct: "Это лицемерие в деяниях (Рия) — совершение поклонения, чтобы люди видели и хвалили. Он не выводит из Ислама, но уничтожает награду.", deviation: "Хариджиты приравнивают рия к большому ширку, объявляя грешников неверующими." },
    { id: 8, badge: "Ширк", title: "8. Ширк в словах и действиях", desc: "Примеры скрытого ширка?", correct: "Клятва не Аллахом, ношение оберегов (тамаим) для защиты, вера в приметы (тиьяра). Это малый ширк, если человек не верит, что предмет сам по себе влияет.", deviation: "Если человек верит, что оберег или амулет защищает сам по себе — это большой ширк. Некоторые ученые-ашариты дозволяют ношение амулетов с аятами, что является спорным и ведет к запретному." },
    { id: 9, badge: "Асма ва-Сыфат", title: "9. Правило «Била кайф» (Без «как»)", desc: "Как мы понимаем атрибуты Аллаха?", correct: "Мы утверждаем атрибуты (Рука, Лицо, Возвышение), принимая их в соответствии с Величием Аллаха, не спрашивая «как» и не уподобляя творениям.", deviation: "Ашариты и матуридиты искажают смыслы (тахвиль), говоря, что «Рука» — это «сила», а «Возвышение» — это «господство»." },
    { id: 10, badge: "Асма ва-Сыфат", title: "10. Запрет на Татыль (Лишение)", desc: "Почему отрицание атрибутов опасно?", correct: "Татыль — это отрицание атрибутов Аллаха. Это путь джахмитов и муътазилитов, которые говорят, что у Аллаха нет ни руки, ни лица, ни направления.", deviation: "Отрицание атрибутов ведет к отрицанию Самого Аллаха, так как Он описывает Себя в Коране. Отрицающий Его атрибуты отрицает Его Самого." },
    { id: 11, badge: "Асма ва-Сыфат", title: "11. Запрет на Тамсиль (Уподобление)", desc: "Как избежать уподобления Творца творению?", correct: "Мы верим: «Нет никого подобного Ему, и Он — Слышащий, Видящий» (42:11). Мы не представляем атрибуты Аллаха в образах творений.", deviation: "Антропоморфисты (хашавия) уподобляют Аллаха творениям, говоря, что у Него руки и ноги как у нас. Это крайность, от которой мы очищены." },
    { id: 12, badge: "Куфр и Иман", title: "12. Определение Имана", desc: "Из чего состоит Иман по мнению Ахлю Сунна?", correct: "Иман — это убеждение сердцем, произнесение языком и совершение действий телом. Он увеличивается от послушания и уменьшается от грехов.", deviation: "Муриджиты говорят, что Иман — это только сердце или язык, а действия не входят в него. Хариджиты же считают, что оставление действия полностью уничтожает Иман." },
    { id: 13, badge: "Куфр и Иман", title: "13. Виды Куфра (Неверия)", desc: "Какие бывают виды куфра?", correct: "Большой куфр (выводит из Ислама) и малый куфр (не выводит, например, неблагодарность, оплакивание с биением). Большой куфр бывает в убеждениях, словах и действиях.", deviation: "Хариджиты называют малый куфр большим, а муриджиты вообще боятся называть явные действия куфром, чтобы не «осудить» человека." },
    { id: 14, badge: "Нифак", title: "14. Виды Лицемерия (Нифак)", desc: "Чем отличается большое лицемерие от малого?", correct: "Большое — это несоответствие сердца словам (скрытый куфр). Малое — это несоответствие тайного явному в действиях (ложь, нарушение обещания).", deviation: "Суфии иногда считают, что «большое сердце» или духовные состояния (халь) прощают малое лицемерие в словах и обещаниях." },
    { id: 15, badge: "Такфир", title: "15. Условия Такфира", desc: "Можно ли сразу объявить мусульманина кафиром?", correct: "Такфир конкретного человека требует соблюдения условий (шарт): знание, намерение, способность. И отсутствия препятствий (мани'): незнание, принуждение, ошибка в иджтихаде.", deviation: "Современные радикалы (гулат) делают массовый такфир без учета препятствий. А джахмиты-муриджиты не делают такфир даже за явное отрицание основ религии." },
    { id: 16, badge: "Сахаба", title: "16. Отношение к Сподвижникам", desc: "Какова наша акыда относительно Сахаба?", correct: "Мы любим их, молимся за них, сдерживаем языки от их разногласий и верим, что они были самыми праведными после Пророка. Мы не проклинаем никого из них.", deviation: "Шиита (рафидиты) проклинают Сахаба, считают их вероотступниками (кроме нескольких). Хариджиты также проклинают их за согласие на суд людей." },
    { id: 17, badge: "Пророчество", title: "17. Чудеса Пророков (Муъджиза)", desc: "Что такое Муъджиза и чем она отличается от магии?", correct: "Муъджиза — это сверхъестественное явление, данное Пророку Аллахом в подтверждение его правдивости. Она несоизмерима с магией и не может быть повторена.", deviation: "Муътазилиты и философы пытаются рационализировать чудеса, называя их «нарушением привычных причин», а не прямым действием Аллаха." },
    { id: 18, badge: "Пророчество", title: "18. Печать Пророчества", desc: "Завершилась ли эпоха пророков?", correct: "Мухаммад, мир ему и благословение, — Печать пророков. После него не будет ни нового пророка, ни посланника. Это единогласное мнение уммы.", deviation: "Лжепророки (как Мусайлима, Мирза Гулам Ахмад) и крайние суфии (утверждающие, что «валий» может достичь уровня пророчества) отвергают этот догмат." },
    { id: 19, badge: "Коран", title: "19. Речь Аллаха", desc: "Сотворен ли Коран?", correct: "Коран — это несотворенная Речь Аллаха, ниспосланная Им. Его атрибуты (включая Речь) несотворенны, как и Его Сущность.", deviation: "Джахмиты и муътазилиты утверждают, что Коран сотворен. Это одно из самых тяжких заблуждений, отрицающих вечный атрибут Аллаха." },
    { id: 20, badge: "Коран", title: "20. Методология Тафсира", desc: "Как правильно толковать Коран?", correct: "1) Коран толкуется Кораном. 2) Сунной. 3) Словами Сахаба. 4) Словами Табиинов. 5) Языковыми нормами арабского. Без этого — opiniон (ра'й).", deviation: "Батиниты и крайние суфии ищут скрытые, эзотерические смыслы (батин), отвергая явный (захир) смысл, что ведет к полному искажению религии." },
    { id: 21, badge: "Судный день", title: "21. Испытание в могиле", desc: "Верим ли мы в Фитна аль-Кабрь (испытание в могиле)?", correct: "Да, умерший будет спрошен об Аллахе, религии и Пророке. Верующий ответит твердо, а лицемер/неверующий скажет: «Не знаю».", deviation: "Муътазилиты, философы и современные рационалисты (включая некоторых ашаритов) отрицают испытание в могиле, называя его метафорой." },
    { id: 22, badge: "Судный день", title: "22. Мизан (Весы)", desc: "Будут ли взвешиваться деяния?", correct: "В Судный День будут установлены реальные Весы (Мизан), на которых будут взвешиваться deeds. Тяжелые чаши с благими делами — спасение, легкие — гибель.", deviation: "Рационалисты и муътазилиты говорят, что «взвешивание» — это лишь метафора справедливости, отрицая физическое существование Весов." },
    { id: 23, badge: "Судный день", title: "23. Сират (Мост над Адом)", desc: "Что такое Сират?", correct: "Это мост, проложенный над Адом. Все люди будут проходить по нему в зависимости от их деяний: кто как молния, кто как ветер, а некоторые упадут в Ад.", deviation: "Отрицание Сирата ведет к отрицанию деталей Судного Дня, что противоречие достоверным хадисам." },
    { id: 24, badge: "Судный день", title: "24. Хауд (Водоём Пророка)", desc: "Что такое Водоём (Хауд)?", correct: "У каждого Пророка будет водоём. Наш водоём — это пруд аль-Каусар. Его вода белее молока, а сосуды — как звезды. Пить из него — значит больше не испытывать жажды.", deviation: "Некоторые современные секты отвергают водоём, а шииты считают, что Али и его потомки будут отгонять людей от водоёма Пророка." },
    { id: 25, badge: "Судный день", title: "25. Шафа'а (Заступничество)", desc: "Какие виды заступничества существуют?", correct: "Большое заступничество (начало Суда), заступничество за вход в Рай, заступничество за грешников, чтобы они вышли из Ада. Все это только с позволения Аллаха.", deviation: "Кубуриты просят заступничества у мертвых («О Пророк, заступись за нас!»). Это ширк, так как заступничество будет только в Судный День и только с разрешения Аллаха." },
    { id: 26, badge: "Судный день", title: "26. Видение Аллаха (Ар-Руья)", desc: "Увидят ли верующие Аллаха?", correct: "Да, верующие увидят Аллаха в Раю, как видят луну в полнолуние. Это величайшее блаженство. Он не окружен местом и не имеет направления.", deviation: "Муътазилиты, джахмиты и ашариты отрицают видение Аллаха глазами, говоря, что «видеть» означает лишь «надеяться» или «знать»." },
    { id: 27, badge: "Рай и Ад", title: "27. Вечность Рая и Ада", desc: "Прекратится ли существование Рая и Ада?", correct: "Рай и Ад сотворены сейчас и будут существовать вечно. Пребывание верующих в Раю и неверующих в Аду бесконечно.", deviation: "Муътазилиты и некоторые заблудшие течения считают, что Ад прекратит свое существование или что грешники выйдут из него не по заступничеству, а по своей воле." },
    { id: 28, badge: "Рай и Ад", title: "28. Грешники из уммы", desc: "Что будет с мусульманами, совершавшими большие грехи?", correct: "Их судьба в руках Аллаха: либо Он простит их по Своей милости, либо накажет в Аду временно, а затем введет в Рай благодаря Таухиду.", deviation: "Хариджиты считают их вечными обитателями Ада. Муътазилиты помещают их в «промежуточное положение», не в Рай и не в Ад." },
    { id: 29, badge: "Кадр (Предопределение)", title: "29. Уровни Кадр", desc: "Из скольких уровней состоит вера в Предопределение?", correct: "Четыре уровня: 1) Аль-Ильм (Знание Аллаха). 2) Аль-Китаб (Запись в Ловх аль-Махфуз). 3) Аль-Машийа (Хотение Аллаха). 4) Аль-Хальк (Создание Аллахом всего сущего).", deviation: "Джабриты (фаталисты) отрицают волю человека, говоря, что он как перо в руке. Кадариты отрицают знание и волю Аллаха над поступками людей." },
    { id: 30, badge: "Кадр (Предопределение)", title: "30. Свобода воли и Кадр", desc: "Как сочетаются свобода воли человека и Предопределение?", correct: "Человек обладает свободой воли и выбором (ихтияр), но его воля подчинена Воле Аллаха. Он совершает действия по своему желанию, но Аллах создал это действие.", deviation: "Джабриты лишают человека воли. Кадариты утверждают, что человек сам творит свои поступки независимо от Воли Аллаха." },
    { id: 31, badge: "Кадр (Предопределение)", title: "31. Отношение к бедам", desc: "Как верующий относится к бедам?", correct: "Он проявляет Сабр (терпение) и Ридá (довольство предопределением), зная, что беда не случилась бы без дозволения Аллаха, и что в ней есть мудрость и очищение.", deviation: "Ропот на судьбу, проклинание времени или обвинение людей/врачей без принятия Кадр — это признак слабости имана и скрытого недовольства Аллахом." },
    { id: 32, badge: "Невидимое (Гайб)", title: "32. Вера в Ангелов", desc: "Какова суть веры в Ангелов?", correct: "Мы верим в их существование из света, их точное подчинение Аллаху и их обязанности (Джибриль, Микаль, Исрафиль, Азраиль, Ангелы могил и т.д.).", deviation: "Философы и муътазилиты говорят, что ангелы — это просто «силы природы» или «законы Вселенной», отрицая их личностную сущность." },
    { id: 33, badge: "Невидимое (Гайб)", title: "33. Джинны и их влияние", desc: "Реально ли влияние джиннов на людей?", correct: "Да, джинны реальны, они созданы из огня. Они могут видеть нас, а мы их — нет. Они могут вредить (посредством сглаза или одержимости), но только с позволения Аллаха.", deviation: "Материалисты и некоторые рационалисты-ашариты отрицают одержимость джиннами, называя ее психическими болезнями. Это противоречие Корану и Сунне." },
    { id: 34, badge: "Невидимое (Гайб)", title: "34. Магия (Сихр)", desc: "Является ли магия реальностью?", correct: "Магия реальна, она существует и может влиять (например, разлучать супругов или вредить здоровью), но ее влияние ограничено Волей Аллаха. Обучение и практика магии — это куфр.", deviation: "Муътазилиты и некоторые современные «ученые» отрицают магию. Другие же (как суфии-амулетники) используют ее, маскируя под «духовные практики»." },
    { id: 35, badge: "Рукия и Тибб", title: "35. Шариатская Рукия", desc: "Каковы условия дозволенной Рукии?", correct: "1) Слова Корана или имена/атрибуты Аллаха. 2) На понятном арабском языке (или с ясным смыслом). 3) Убеждение, что исцеляет только Аллах, а Рукия — лишь причина.", deviation: "Использование непонятных заклинаний, обращение к джиннам, использование талисманов с символами — это запретная Рукия, ведущая к ширку." },
    { id: 36, badge: "Бид'а (Нововведения)", title: "36. Определение Бид'а", desc: "Что такое религиозное нововведение?", correct: "Бид'а — это выдуманное в религии нечто, чего не было у Пророка и его сподвижников, с целью приближения к Аллаху. Каждая бид'а — это заблуждение.", deviation: "Суфии и ашариты делят бид'а на «хорошие» и «плохие». Ахлю Сунна единогласны: в поклонении нет «хороших» нововведений, все они ведут в Ад." },
    { id: 37, badge: "Бид'а (Нововведения)", title: "37. Опасность Бид'а", desc: "Почему бид'а хуже, чем большие грехи?", correct: "Бид'а разрушает религию изнутри, человек считает грех поклонением. Раскаяние от бид'а требует оставления самого нововведения и призыва других к Сунне.", deviation: "Муриджиты и суфии считают, что «чистое сердце» или «любовь к Пророку» компенсируют следование бид'а. Это опаснейшее заблуждение." },
    { id: 38, badge: "Валийя (Друзья Аллаха)", title: "38. Признаки Валиев (Праведников)", desc: "Кто такие истинные Валии Аллаха?", correct: "Это люди, обладающие глубоким иманом и строго следующие Сунне. Их главный признак — соблюдение Шариата, а не полеты или хождение по воде.", deviation: "Крайние суфии считают, что Валий стоит выше Пророков и что Шариат для них отменен (вадифа). Это явный куфр." },
    { id: 39, badge: "Валийя (Друзья Аллаха)", title: "39. Чудеса Валиев (Карамат)", desc: "Допускаются ли чудеса у праведников?", correct: "Да, Карамат реален и дается праведнику как подтверждение его праведности. Но это всегда происходит по Воле Аллаха и в рамках Шариата, без вызова к себе.", deviation: "Суфии приписывают своим шейхам чудеса, которые противоречат Шариату (например, оставление намаза). Истинное чудо не противоречит Сунне." },
    { id: 40, badge: "Такфир и Методология", title: "40. Отношение к грешникам", desc: "Как мы относимся к мусульманину, совершившему большой грех?", correct: "Он остается мусульманином, если не считает грех халялем. Мы не лишаем его имана полностью, но говорим, что его иман ослаб. Мы не проклинаем его персонально.", deviation: "Хариджиты объявляют его кафиром. Муриджиты говорят, что грех вообще не вредит иману. Ахлю Сунна — посередине." },
    { id: 41, badge: "Такфир и Методология", title: "41. Вера и слова «ИншаАллах»", desc: "Говорим ли мы «я — верующий» без оговорки?", correct: "Мы говорим: «Я верующий, если пожелает Аллах» (иншаАллах). Мы не гарантируем себе Рай, так как не знаем, чем закончится наша жизнь.", deviation: "Муриджиты и крайние суфии говорят «я — 100% верующий и житель Рая», проявляя самоуверенность и отсутствие страха перед Аллахом." },
    { id: 42, badge: "Судный день", title: "42. Признаки Часа", desc: "Верим ли мы в малые и большие признаки Часа?", correct: "Да, мы верим во все, что пришло в достоверных хадисах: от появления лжепророков до выхода Даджаля, Исы (мир ему), Яджуджа и Маджуджа, и солнца с запада.", deviation: "Рационалисты (муътазилиты, ашариты, философы) аллегоризируют большие признаки, говоря, что Даджаль — это «система», а Яджудж — это «микробы»." },
    { id: 43, badge: "Пророчество", title: "43. Вознесение Пророка (Исра и Мирадж)", desc: "Было ли ночное путешествие Пророка телом и душой?", correct: "Да, Пророк был перенесен из Мекки в Иерусалим, а затем вознесен на небеса и к Сидрат аль-Мунтаха телом и душой, наяву, а не во сне.", deviation: "Муътазилиты и некоторые философы утверждают, что это был лишь сон или духовное путешествие, отрицая физическое вознесение." },
    { id: 44, badge: "Таухид аль-Улюхийя", title: "44. Запрет на Тауассуль через мертвых", desc: "Можно ли просить у мертвого Пророка?", correct: "Категорически нет. Обращение с мольбой (дуа) к мертвым, даже к Пророкам и праведникам — это большой ширк. Мертвые не слышат наших просьб и не могут ответить.", deviation: "Кубуриты и многие суфии взывают: «Я Расуляллах, агисна!» (О Посланник, помоги!). Это выводит из Ислама, так как ддуа — это суть поклонения." },
    { id: 45, badge: "Таухид аль-Улюхийя", title: "45. Разрешенный Тауассуль", desc: "Какие виды посредничества дозволены?", correct: "1) Через имена и атрибуты Аллаха. 2) Через праведные deeds. 3) Через дуа живого праведника. 4) Через личность Пророка (в некоторых мнениях, но лучше через его статус).", deviation: "Ашариты разрешают тауассуль «правом» или «личностью» Пророка (би-джахи), что ведет к преувеличению и ширку в отношении мертвых." },
    { id: 46, badge: "Судный день", title: "46. Хадж (Паломничество) и его суть", desc: "Является ли Хадж столпом Ислама?", correct: "Да, Хадж — это пятый столп Ислама, обязательный раз в жизни для тех, кто имеет возможность. Его отвержение — это куфр.", deviation: "Бабиниты и карматы в истории отвергали обязательность Хаджа, считая, что «истинный Хадж» — это посещение своего имама или духовное очищение." },
    { id: 47, badge: "Такфир и Методология", title: "47. Отношение к Правителям", desc: "Какова наша акыда в отношении мусульманских правителей?", correct: "Мы подчиняемся им в том, что не противоречит Шариату, даже если они несправедливы. Мы не восстаем против них, если видим явный куфр, и не делаем им такфир за грехи.", deviation: "Хариджиты и современные радикалы (кутбисты) объявляют правителей кафирами за суд не по Шариату и призывают к джихаду против них. Ахлю Сунна запрещает это." },
    { id: 48, badge: "Бид'а (Нововведения)", title: "48. Празднование Мавлида", desc: "Каково постановление празднования дня рождения Пророка?", correct: "Это бид'а (нововведение), которого не было у Сахаба. Несмотря на любовь к Пророку, мы не можем вводить в религию то, чего не делали лучшие поколения.", deviation: "Ашариты и суфии считают Мавлид «хорошим нововведением» и обязательным проявлением любви. Это противоречит принципу «каждое бид'а — заблуждение»." },
    { id: 49, badge: "Невидимое (Гайб)", title: "49. Вера в предыдущие Писания", desc: "Как мы относимся к Торе и Евангелию?", correct: "Мы верим, что они были ниспосланы Аллахом. Но мы не читаем их, не подтверждаем их и не отрицаем. Мы верим только в то, что Коран подтвердил или опроверг.", deviation: "Иудаисты и христиане искажают их. А некоторые современные «диалогисты» считают, что все книги одинаково верны, что противоречит концепции Таухида." },
    { id: 50, badge: "Таухид аль-Улюхийя", title: "50. Истина и Заблуждение", desc: "Существует ли «множество истинных путей»?", correct: "Истина одна — это Коран и Сунна в понимании Сахаба. Все, что противоречит этому — заблуждение. Религия не делится на «школы», которые одинаково верны.", deviation: "Суфии и философы говорят: «Все пути ведут к Аллаху», уравнивая Сунну, бид'а и даже другие религии. Это явное противоречие аяту: «Истинная религия у Аллаха — Ислам»." }
];

// Generate Cards
const grid = document.getElementById('questionsGrid');
questionsData.forEach(q => {
    const card = document.createElement('div');
    card.className = 'question-card';
    card.onclick = () => openModal(q);
    card.innerHTML = `
        <span class="badge">${q.badge}</span>
        <h3>${q.title}</h3>
        <p>${q.desc}</p>
    `;
    grid.appendChild(card);
});

// Modal Logic
function openModal(q) {
    document.getElementById('modalTitle').innerText = q.title;
    document.getElementById('modalCorrect').innerText = q.correct;
    document.getElementById('modalDeviation').innerText = q.deviation;
    document.getElementById('mainModal').style.display = 'flex';
}

function closeModal() {
    document.getElementById('mainModal').style.display = 'none';
}

window.onclick = function(event) {
    const modal = document.getElementById('mainModal');
    if (event.target === modal) {
        modal.style.display = 'none';
    }
}
</script>
